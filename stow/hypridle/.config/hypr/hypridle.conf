$on_ac_power = systemd-ac-power

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# Battery
listener {
    timeout = 150 # 2.5min.
    on-timeout = $on_ac_power || brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = $on_ac_power || brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# On AC
listener {
    timeout = 300 # 5min
    on-timeout = $on_ac_power && loginctl lock-session            # lock screen when timeout has passed
}

# On battery
listener {
    timeout = 60 # 1min
    on-timeout = $on_ac_power || loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = $on_ac_power || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

# On AC
listener {
    timeout = 600                                 # 10 min
    on-timeout = $on_ac_power $$ systemctl suspend                # suspend pc
}

# On Battery
listener {
    timeout = 300 # 5 min
    on-timeout = $on_ac_power || systemctl suspend                # suspend pc
}
