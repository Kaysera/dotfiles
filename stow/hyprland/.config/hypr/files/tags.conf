# Tag floating apps
windowrule = tag +floating-window, match:class (blueman-manager|float.Impala|float.Wiremix|org.gnome.NautilusPreviewer|Bitwarden)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files)

# Tag Videocall apps
windowrule = tag +videocall, match:class .*meet.google.com.* # Google Meet
windowrule = tag +videocall, match:initial_class slack match:initial_title .*junta.* # Slack Huddles (Junta in Spanish)
windowrule = tag +videocall, match:class .*eklohemcaidmdodheamaonenkegafdne.* # Google Meet PWA

# Tag Code Editors
windowrule = tag +codeeditor, match:class (codium|code|.*zed.*) # VSCodium, VSCode and Zed editor

# Tag Terminal Emulators
windowrule = tag +terminal, match:class .*tty.*

# Tag Internet Browsers
windowrule = tag +browser, match:class (.*zen|chromium-browser|.*helium)
windowrule = tag +browser, match:initial_title (.*Chromium.*)

# Tag LLMs
windowrule = tag +llm, match:class (chrome-claude.ai.*)

# Tag Notion app
windowrule = tag +notion, match:class (chrome-notion.so.*)
windowrule = tag +notion, match:class (chrome-www.notion.so.*)

# Tag Mail app
windowrule = tag +mail, match:class (chrome-mail.notion.so.*)

# Tag Calendar app
windowrule = tag +calendar, match:class (chrome-calendar.notion.so.*)
