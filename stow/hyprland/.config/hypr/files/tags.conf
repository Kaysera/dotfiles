# Tag floating apps
windowrule = tag +floating-window, class:(blueman-manager|float.Impala|float.Wiremix|org.gnome.NautilusPreviewer)
windowrule = tag +floating-window, class:(xdg-desktop-portal-gtk|DesktopEditors|org.gnome.Nautilus), title:^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files)

# Tag Videocall apps
windowrule = tag +videocall, class:.*meet.google.com.* # Google Meet PWA
windowrule = tag +videocall, class:Slack title:.*Junta.* # Slack Huddles (Junta in Spanish)

# Tag Code Editors
windowrule = tag +codeeditor, class:(codium|code|.*zed.*) # VSCodium, VSCode and Zed editor

# Tag Terminal Emulators
windowrule = tag +terminal, class:.*tty.*

# Tag Internet Browsers
windowrule = tag +browser, class:(.*zen|chromium-browser)
windowrule = tag +browser, initialTitle:(.*Chromium.*)

# Tag Mail app
windowrule = tag +mail, class:(chrome-mail.notion.so*)

# Tag Calendar app
windowrule = tag +calendar, class:(chrome-calendar.notion.so*)
