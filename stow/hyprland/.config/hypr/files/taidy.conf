##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules


workspace = 7, persistent:true  # Mail and Calendar workspace
workspace = 8, persistent:true  # Notion (Cohesion) workspace
workspace = 9, persistent:true  # Slack workspace

windowrule = workspace 7, class:(chrome-calendar.notion.so.*|chrome-mail.notion.so.*)
windowrule = workspace 8, class:cohesion
windowrule = workspace 9, class:Slack

exec-once = [workspace 7 silent] chromium-browser --disable-features=WaylandWpColorManagerV1 --app="https://mail.notion.so"
exec-once = [workspace 7 silent] chromium-browser --disable-features=WaylandWpColorManagerV1 --app="https://calendar.notion.so"
exec-once = [workspace 8 silent] flatpak run io.github.brunofin.Cohesion 
exec-once = [workspace 9 silent] slack --enable-features=UseOzonePlatform --ozone-platform=wayland 
