##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace = 1, persistent:true  # Browser workspace
workspace = 2, persistent:true  # Editor (vscode) workspace
workspace = 3, persistent:true  # Terminal (ghostty) workspace

windowrule = workspace 1, class:.*zen
windowrule = workspace 1, class:chromium-browser
windowrule = workspace 2, class:(codium|code)
windowrule = workspace 3, class:.*tty.*

exec-once = [workspace 1 silent] flatpak run app.zen_browser.zen 
exec-once = [workspace 2 silent] codium --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once = [workspace 3 silent] ghostty
exec-once = [workspace 4 silent] input-leap --config "~/.config/input-leap.conf" --daemon
