##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

workspace = 1, persistent:true  # Browser workspace
workspace = 2, persistent:true  # Editor (vscode) workspace
workspace = 3, persistent:true  # Terminal (ghostty) workspace

windowrule = workspace 1, tag:browser
windowrule = workspace 2, tag:codeeditor
windowrule = workspace 3, tag:terminal

exec-once = [workspace 1 silent] uwsm app -- flatpak run app.zen_browser.zen 
exec-once = [workspace 2 silent] uwsm app -- codium --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once = [workspace 3 silent] uwsm app -- ghostty
exec-once = [workspace 4 silent] uwsm app -- input-leap --config "~/.config/input-leap.conf" --daemon
